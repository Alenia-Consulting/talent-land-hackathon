services:
  # Same image as kubernetes/overlays/staging/postgres. Reads POSTGRES_* from api/.env.
  talent-land-hackathon-postgres:
    image: postgres:15.18-alpine3.24
    restart: unless-stopped
    env_file:
      - api/.env
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  talent-land-hackathon-frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      - API_UPSTREAM=talent-land-hackathon-api:8000
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - talent-land-hackathon-api

  talent-land-hackathon-api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    # DATABASE_URL in api/.env must use the host "talent-land-hackathon-postgres".
    env_file:
      - api/.env
    depends_on:
      talent-land-hackathon-postgres:
        condition: service_healthy

volumes:
  pg-data:
