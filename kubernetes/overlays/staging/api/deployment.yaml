apiVersion: apps/v1
kind: Deployment
metadata:
  name: talent-land-hackathon-api-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talent-land-hackathon-api
  template:
    metadata:
      annotations:
        # Renders every key of the Vault secret (DATABASE_URL, ...) to /vault/secrets/.env,
        # sourced by docker/backend/entrypoint.sh before migrations and uvicorn.
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "talent-land-hackathon-staging"
        vault.hashicorp.com/agent-inject-secret-.env: "secret/data/talent-land-hackathon/staging"
        vault.hashicorp.com/agent-inject-template-.env: |
          {{- with secret "secret/data/talent-land-hackathon/staging" -}}
          {{- range $key, $value := .Data.data -}}
          {{ $key }}="{{ $value }}"
          {{ end -}}
          {{- end -}}
        vault.hashicorp.com/agent-pre-populate-only: "true"
      labels:
        app: talent-land-hackathon-api
    spec:
      containers:
        - name: talent-land-hackathon-api
          image: ghcr.io/alenia-consulting/talent-land-hackathon-api:0.0.3
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
      imagePullSecrets:
        - name: github-registry-alenia-secret
