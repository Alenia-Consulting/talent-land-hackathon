apiVersion: apps/v1
kind: Deployment
metadata:
  name: talent-land-hackathon-api-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talent-land-hackathon-api
  template:
    metadata:
      annotations:
        # Renders every key of the Vault secret (DATABASE_URL pointing at Supabase, ...) to
        # /vault/secrets/.env,
        # sourced by docker/backend/entrypoint.sh before migrations and uvicorn.
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "talent-land-hackathon-staging"
        vault.hashicorp.com/agent-inject-secret-.env: "secret/data/talent-land-hackathon/staging"
        vault.hashicorp.com/agent-inject-template-.env: |
          {{- with secret "secret/data/talent-land-hackathon/staging" -}}
          {{- range $key, $value := .Data.data -}}
          {{ $key }}="{{ $value }}"
          {{ end -}}
          {{- end -}}
        vault.hashicorp.com/agent-pre-populate-only: "true"
      labels:
        app: talent-land-hackathon-api
    spec:
      containers:
        - name: talent-land-hackathon-api
          image: ghcr.io/alenia-consulting/talent-land-hackathon-api:0.0.16
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # Blurring faces runs the detector on every 2nd frame at 640 px. Measured in this image
            # with 2 CPUs on a 2 minute 1280x720 recording: about 30 s, against the 300 s the ingress
            # waits (a portrait phone recording costs more, around 2-3x). Memory peaked around 150 MB.
            # One recording is processed at a time (a lock in media/pipeline.py), so a second upload
            # waits for the first.
            requests:
              cpu: "1000m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
      imagePullSecrets:
        - name: github-registry-alenia-secret
