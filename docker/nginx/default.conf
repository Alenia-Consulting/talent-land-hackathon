server {
    listen 80 default_server;
    server_name _;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        # Next.js static export: /about is served from about.html, unknown paths get 404.html.
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /404.html;
    }

    # Written at container start (docker/frontend/entrypoint.sh): never cached.
    location = /env.js {
        root  /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        # Recordings go through here (POST /api/guides/{id}/video). 50 MB is the Supabase Storage file
        # limit, the same as MAX_VIDEO_BYTES in api/routers/guides.py; nginx defaults to 1 MB.
        client_max_body_size 50m;
        proxy_pass         http://__API_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
