name: Python CI api

on:
  pull_request:
    branches: [development]
    paths:
      - 'api/**'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.9"
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Compile Check
        run: python -m compileall -q -x '(^|/)\.venv/' .

      - name: Import Check
        run: python -c "from main import app; print(app.title)"

      - name: Lint Check
        run: |
          if ! command -v ruff >/dev/null; then
            echo "ruff is not in api/requirements-dev.txt, skipping"
            exit 0
          fi
          ruff check .

      - name: Format Check
        run: |
          if ! command -v ruff >/dev/null; then
            echo "ruff is not in api/requirements-dev.txt, skipping"
            exit 0
          fi
          ruff format --check .

      - name: Run Unit Tests
        run: |
          if [ ! -d test ]; then
            echo "::notice::No api/test/ directory, skipping unit tests"
            exit 0
          fi
          pytest test/ --cov=. --cov-report=term-missing --cov-fail-under=85
