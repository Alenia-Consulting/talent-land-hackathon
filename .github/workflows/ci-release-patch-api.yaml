name: Release Patch api

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - 'api/**'

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version and update api pyproject.toml
        id: backend-version
        run: |
          CURRENT=$(python3 -c "import tomllib; print(tomllib.load(open('api/pyproject.toml', 'rb'))['project']['version'])")
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s/^version = \"$CURRENT\"$/version = \"$NEW_VERSION\"/" api/pyproject.toml
          grep -q "^version = \"$NEW_VERSION\"$" api/pyproject.toml || (echo "::error::Version bump failed in api/pyproject.toml" && exit 1)
          echo "BACKEND_TAG=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/backend/Dockerfile
          push: true
          tags: ghcr.io/alenia-consulting/talent-land-hackathon-api:${{ steps.backend-version.outputs.BACKEND_TAG }}

      - name: Commit bumped version to api
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git status
          git add api/pyproject.toml

          NEW_VERSION="${{ steps.backend-version.outputs.BACKEND_TAG }}"
          MANIFEST="kubernetes/overlays/staging/api/deployment.yaml"

          sed -i "s|image: ghcr.io/alenia-consulting/talent-land-hackathon-api:.*|image: ghcr.io/alenia-consulting/talent-land-hackathon-api:$NEW_VERSION|" $MANIFEST

          git add $MANIFEST
          git commit -m "(ci) Update talent-land-hackathon-api image to v$NEW_VERSION [skip ci]"

          for i in 1 2 3; do
            git push origin HEAD:main && break
            echo "Push rejected, retrying ($i)..."
            git fetch origin main
            git rebase origin/main
          done
