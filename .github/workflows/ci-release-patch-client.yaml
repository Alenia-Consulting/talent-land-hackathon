name: Release Patch client

on:
  workflow_dispatch:
  pull_request:
    branches: [development]
    types: [closed]
    paths:
      - 'client/**'

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version and update client package.json
        id: client-version
        run: |
          CURRENT=$(node -p "require('./client/package.json').version")
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW_VERSION\"/" client/package.json
          echo "FRONTEND_TAG=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/frontend/Dockerfile
          push: true
          tags: ghcr.io/alenia-consulting/talent-land-hackathon-frontend:${{ steps.client-version.outputs.FRONTEND_TAG }}

      - name: Commit bumped version to client
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git status
          git add client/package.json

          NEW_VERSION="${{ steps.client-version.outputs.FRONTEND_TAG }}"
          MANIFEST="kubernetes/overlays/staging/client/deployment.yaml"

          sed -i "s|image: ghcr.io/alenia-consulting/talent-land-hackathon-frontend:.*|image: ghcr.io/alenia-consulting/talent-land-hackathon-frontend:$NEW_VERSION|" $MANIFEST

          git add $MANIFEST
          git commit -m "(ci) Update talent-land-hackathon-frontend image to v$NEW_VERSION [skip ci]"

          for i in 1 2 3; do
            git push origin HEAD:main && break
            echo "Push rejected, retrying ($i)..."
            git fetch origin main
            git rebase origin/main
          done
