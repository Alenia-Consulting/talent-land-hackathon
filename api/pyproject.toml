[project]
name = "talent-land-hackathon"
version = "0.0.8"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.58",
    "alembic==1.19.2",
    "psycopg[binary]==3.3.8",
    "python-multipart==0.0.20",
    "deface==1.5.0",
    "opencv-python==5.1.0.95",
    "numpy==2.5.5",
    "imageio-ffmpeg==0.8.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[tool.coverage.run]
omit = ["migrations/*", "test/*", "scripts/*"]
